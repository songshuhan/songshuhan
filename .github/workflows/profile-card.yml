name: Refresh profile card

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_profile.py
      - name: Publish changed card
        run: |
          git add -- assets/terminal.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public GitHub statistics'
          git push
